<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusAssist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div>
          <p class="eyebrow">Demo Institute of Technology</p>
          <h1>CampusAssist</h1>
          <p class="subtitle">College rules, exams &amp; admission</p>
        </div>
      </header>

      <section class="chips" aria-label="Suggested questions" id="chips"></section>

      <main class="thread" id="thread" aria-live="polite"></main>

      <form class="composer" id="composer">
        <label class="sr-only" for="input">Your question</label>
        <input
          id="input"
          type="text"
          autocomplete="off"
          placeholder="Ask about rules, exams, admission…"
        />
        <button type="submit" id="send">Send</button>
      </form>

      <footer class="footer">Powered by Amazon Bedrock + AgentCore</footer>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
