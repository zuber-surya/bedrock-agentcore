name: Deploy CampusAssist

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  STACK_NAME: campusassist
  # Target account: IAM user zuber (override only if migrating)
  TARGET_AWS_ACCOUNT_ID: ${{ vars.TARGET_AWS_ACCOUNT_ID || '390403887579' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s lambda/tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Configure AWS credentials (zuber access keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account is zuber
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          ARN=$(aws sts get-caller-identity --query Arn --output text)
          echo "Caller: $ARN"
          if [ "$ACCOUNT" != "$TARGET_AWS_ACCOUNT_ID" ]; then
            echo "::error::Expected account $TARGET_AWS_ACCOUNT_ID (zuber), got $ACCOUNT. Update GitHub secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY to the zuber IAM user."
            exit 1
          fi

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Deploy infra (SAM)
        env:
          DOCS_BUCKET: ${{ vars.DOCS_BUCKET || 'campusassist-kb-zuber-390403887579' }}
        run: |
          if [ -z "$DOCS_BUCKET" ]; then
            echo "Set repository variable DOCS_BUCKET (globally unique S3 name)"
            exit 1
          fi
          OVERRIDES="ProjectName=campusassist UseBedrock=${{ vars.USE_BEDROCK || 'true' }} BedrockModelId=${{ vars.BEDROCK_MODEL_ID || 'us.anthropic.claude-haiku-4-5-20251001-v1:0' }} BedrockFallbackModelId=${{ vars.BEDROCK_FALLBACK_MODEL_ID || 'us.amazon.nova-lite-v1:0' }} DocsBucketName=$DOCS_BUCKET KnowledgeBaseId=${{ vars.KNOWLEDGE_BASE_ID || 'WHR65SMI6I' }}"
          if [ -n "${{ vars.AGENT_RUNTIME_ARN }}" ]; then
            OVERRIDES="$OVERRIDES AgentRuntimeArn=${{ vars.AGENT_RUNTIME_ARN }}"
          fi
          if [ -n "${{ vars.AGENT_RUNTIME_ARN_PLACEMENT }}" ]; then
            OVERRIDES="$OVERRIDES AgentRuntimeArnPlacement=${{ vars.AGENT_RUNTIME_ARN_PLACEMENT }}"
          fi
          sam deploy \
            --template-file infra/template.yaml \
            --stack-name "$STACK_NAME" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides $OVERRIDES

      - name: Sync KB docs to S3
        env:
          DOCS_BUCKET: ${{ vars.DOCS_BUCKET || 'campusassist-kb-zuber-390403887579' }}
        run: |
          aws s3 sync docs/kb "s3://${DOCS_BUCKET}/kb/" --delete

      - name: Start KB ingestion (S3 Vectors)
        env:
          KNOWLEDGE_BASE_ID: ${{ vars.KNOWLEDGE_BASE_ID || 'WHR65SMI6I' }}
          KB_DATA_SOURCE_ID: ${{ vars.KB_DATA_SOURCE_ID || 'BHYJWSVBYJ' }}
        run: |
          if [ -z "$KNOWLEDGE_BASE_ID" ] || [ -z "$KB_DATA_SOURCE_ID" ]; then
            echo "Skip ingestion (KNOWLEDGE_BASE_ID / KB_DATA_SOURCE_ID unset)"
            exit 0
          fi
          aws bedrock-agent start-ingestion-job \
            --knowledge-base-id "$KNOWLEDGE_BASE_ID" \
            --data-source-id "$KB_DATA_SOURCE_ID" \
            --region "$AWS_REGION" || true

      - name: Build UI
        working-directory: ui
        env:
          VITE_API_URL: ${{ vars.API_URL || 'https://hrw28diu26.execute-api.us-east-1.amazonaws.com/prod/chat' }}
        run: |
          npm install
          npm run build

      - name: Publish UI summary
        run: |
          API=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='ApiEndpoint'].OutputValue" --output text)
          UI_BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='UiBucketNameOut'].OutputValue" --output text || true)
          UI_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='UiWebsiteURL'].OutputValue" --output text || true)
          DIST_ID=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text || true)
          CF=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='CloudFrontURL'].OutputValue" --output text || true)
          echo "Account=$TARGET_AWS_ACCOUNT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "API=$API" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$UI_BUCKET" ] && [ "$UI_BUCKET" != "None" ]; then
            cd ui
            VITE_API_URL="$API" npm run build
            aws s3 sync dist "s3://${UI_BUCKET}/" --delete
            cd ..
            if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
              aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
              echo "UI=$CF" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "UI (HTTP, CloudFront pending account verification)=$UI_URL" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "UI bucket not in stack — API-only deploy. Point local UI at API." >> "$GITHUB_STEP_SUMMARY"
          fi
