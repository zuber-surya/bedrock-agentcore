AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CampusAssist — API Gateway + Invoke Lambda (Wave 1; no CloudFront until account verified)

Parameters:
  ProjectName:
    Type: String
    Default: campusassist
  MockMode:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  AgentRuntimeArn:
    Type: String
    Default: ""
  DocsBucketName:
    Type: String
    Description: Globally unique S3 bucket for KB docs

Resources:
  DocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref DocsBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  InvokeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-invoke"
      Runtime: python3.12
      Handler: handler.handler
      CodeUri: ../lambda/invoke/
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          MOCK_MODE: !Ref MockMode
          AGENT_RUNTIME_ARN: !Ref AgentRuntimeArn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:*
                - bedrock-agentcore:*
              Resource: "*"
      Events:
        ChatPost:
          Type: HttpApi
          Properties:
            Path: /chat
            Method: POST
            ApiId: !Ref HttpApi
        ChatOptions:
          Type: HttpApi
          Properties:
            Path: /chat
            Method: OPTIONS
            ApiId: !Ref HttpApi

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
        AllowMethods:
          - POST
          - OPTIONS

  AdmissionDeadlineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-admission-deadline"
      Runtime: python3.12
      Handler: handlers.handler_admission_deadline
      CodeUri: ../lambda/tools/
      Timeout: 15

  ExamScheduleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-exam-schedule"
      Runtime: python3.12
      Handler: handlers.handler_exam_schedule
      CodeUri: ../lambda/tools/
      Timeout: 15

  CreateTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-create-ticket"
      Runtime: python3.12
      Handler: handlers.handler_create_ticket
      CodeUri: ../lambda/tools/
      Timeout: 15

Outputs:
  ApiEndpoint:
    Description: Chat API URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod/chat"
  DocsBucketNameOut:
    Value: !Ref DocsBucket
  UiNote:
    Description: CloudFront deferred until AWS account is verified for CloudFront
    Value: "Run UI locally: cd ui && set VITE_API_URL=<ApiEndpoint> && npm run dev"
