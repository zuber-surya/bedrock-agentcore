AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CampusAssist — API Gateway + Invoke Lambda (mock or AgentCore)

Parameters:
  ProjectName:
    Type: String
    Default: campusassist
  MockMode:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  AgentRuntimeArn:
    Type: String
    Default: ""
  DocsBucketName:
    Type: String
    Description: Existing or to-create bucket name for KB docs and UI (globally unique)

Resources:
  DocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref DocsBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  UiBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${DocsBucketName}-ui"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CloudFrontOAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub "${ProjectName} UI OAI"

  UiBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UiBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              CanonicalUser: !GetAtt CloudFrontOAI.S3CanonicalUserId
            Action: s3:GetObject
            Resource: !Sub "${UiBucket.Arn}/*"

  UiDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: uiS3
            DomainName: !GetAtt UiBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub "origin-access-identity/cloudfront/${CloudFrontOAI}"
        DefaultCacheBehavior:
          TargetOriginId: uiS3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          Compress: true

  InvokeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-invoke"
      Runtime: python3.12
      Handler: handler.handler
      CodeUri: ../lambda/invoke/
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          MOCK_MODE: !Ref MockMode
          AGENT_RUNTIME_ARN: !Ref AgentRuntimeArn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:*
                - bedrock-agentcore:*
              Resource: "*"
      Events:
        ChatPost:
          Type: HttpApi
          Properties:
            Path: /chat
            Method: POST
            ApiId: !Ref HttpApi
        ChatOptions:
          Type: HttpApi
          Properties:
            Path: /chat
            Method: OPTIONS
            ApiId: !Ref HttpApi

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
        AllowMethods:
          - POST
          - OPTIONS

  AdmissionDeadlineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-admission-deadline"
      Runtime: python3.12
      Handler: handlers.handler_admission_deadline
      CodeUri: ../lambda/tools/
      Timeout: 15

  ExamScheduleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-exam-schedule"
      Runtime: python3.12
      Handler: handlers.handler_exam_schedule
      CodeUri: ../lambda/tools/
      Timeout: 15

  CreateTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-create-ticket"
      Runtime: python3.12
      Handler: handlers.handler_create_ticket
      CodeUri: ../lambda/tools/
      Timeout: 15

Outputs:
  ApiEndpoint:
    Description: Chat API URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/chat"
  CloudFrontURL:
    Description: CampusAssist UI URL
    Value: !Sub "https://${UiDistribution.DomainName}"
  DocsBucketNameOut:
    Value: !Ref DocsBucket
  UiBucketNameOut:
    Value: !Ref UiBucket
  DistributionId:
    Value: !Ref UiDistribution
