AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CampusAssist — API Gateway + Invoke Lambda (CloudFront deferred until AWS account verified)

Parameters:
  ProjectName:
    Type: String
    Default: campusassist
  AgentRuntimeArn:
    Type: String
    Default: ""
  AgentRuntimeArnPlacement:
    Type: String
    Default: ""
  UseBedrock:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  BedrockModelId:
    Type: String
    Default: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
  BedrockFallbackModelId:
    Type: String
    Default: "us.amazon.nova-lite-v1:0"
  KnowledgeBaseId:
    Type: String
    Default: ""
    Description: Bedrock Knowledge Base ID (S3 Vectors Retrieve)
  DocsBucketName:
    Type: String
    Description: Globally unique S3 bucket for KB docs

Resources:
  UiBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-ui-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  UiBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UiBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${UiBucket.Arn}/*"

  DocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref DocsBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  StudentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-students"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: studentId
          AttributeType: S
      KeySchema:
        - AttributeName: studentId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  InvokeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-invoke"
      Runtime: python3.12
      Handler: handler.handler
      CodeUri: ../lambda/invoke/
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          AGENT_RUNTIME_ARN: !Ref AgentRuntimeArn
          AGENT_RUNTIME_ARN_PLACEMENT: !Ref AgentRuntimeArnPlacement
          USE_BEDROCK: !Ref UseBedrock
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_FALLBACK_MODEL_ID: !Ref BedrockFallbackModelId
          KNOWLEDGE_BASE_ID: !Ref KnowledgeBaseId
          STUDENTS_TABLE: !Ref StudentsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:*
                - bedrock-agentcore:*
              Resource: "*"
            - Sid: BedrockKbRetrieve
              Effect: Allow
              Action:
                - bedrock:Retrieve
                - bedrock:RetrieveAndGenerate
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
            - Sid: StudentsTableRead
              Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt StudentsTable.Arn
            - Sid: BedrockMarketplaceModelAccess
              Effect: Allow
              Action:
                - aws-marketplace:Subscribe
                - aws-marketplace:Unsubscribe
                - aws-marketplace:ViewSubscriptions
              Resource: "*"
      Events:
        ChatPost:
          Type: HttpApi
          Properties:
            Path: /chat
            Method: POST
            ApiId: !Ref HttpApi
        ChatOptions:
          Type: HttpApi
          Properties:
            Path: /chat
            Method: OPTIONS
            ApiId: !Ref HttpApi

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
        AllowMethods:
          - POST
          - OPTIONS

  AdmissionDeadlineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-admission-deadline"
      Runtime: python3.12
      Handler: handlers.handler_admission_deadline
      CodeUri: ../lambda/tools/
      Timeout: 15

  ExamScheduleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-exam-schedule"
      Runtime: python3.12
      Handler: handlers.handler_exam_schedule
      CodeUri: ../lambda/tools/
      Timeout: 15

  CreateTicketFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-create-ticket"
      Runtime: python3.12
      Handler: handlers.handler_create_ticket
      CodeUri: ../lambda/tools/
      Timeout: 15

Outputs:
  ApiEndpoint:
    Description: Chat API URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod/chat"
  DocsBucketNameOut:
    Value: !Ref DocsBucket
  UiBucketNameOut:
    Description: S3 bucket hosting the static UI (public, HTTP-only until CloudFront is verified)
    Value: !Ref UiBucket
  UiWebsiteURL:
    Description: Public HTTP URL for the UI (S3 static website hosting; upgrade to CloudFront once account is verified)
    Value: !Sub "http://${UiBucket}.s3-website-${AWS::Region}.amazonaws.com"
  StudentsTableName:
    Description: DynamoDB table for demo student records
    Value: !Ref StudentsTable
