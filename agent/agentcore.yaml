# AgentCore direct code deploy — no Docker.
# Deploy with AgentCore CLI (@aws/agentcore), e.g.:
#   agentcore deploy  (from agent/ after configure)
name: campusassist-agent
entrypoint: main.py
runtime: python3.12
deployment: direct_code
environment:
  USE_BEDROCK: "true"
  BEDROCK_MODEL_ID: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
  BEDROCK_FALLBACK_MODEL_ID: "us.amazon.nova-lite-v1:0"
  KNOWLEDGE_BASE_ID: "WHR65SMI6I"
  STUDENTS_TABLE: "campusassist-students"
