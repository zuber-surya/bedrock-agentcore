# AgentCore direct code deploy — no Docker.
# Package with AgentCore CLI when available, e.g.:
#   agentcore deploy --code . --name campusassist-agent
name: campusassist-agent
entrypoint: main.py
runtime: python3.12
deployment: direct_code
environment:
  USE_BEDROCK: "false"
  # Set true + BEDROCK_MODEL_ID after model access is enabled
  # BEDROCK_MODEL_ID: amazon.nova-lite-v1:0
